packages:
  - packages/*
  - examples/*
  # The docs site (plan 11a). An app, not a library: it is never published.
  - apps/*

# A version younger than one day is the common window for a malicious publish.
minimumReleaseAge: 1440

# pnpm fails the install on any build script that is not listed here.
# Add a package only after you read its script. Write the reason on the line.
allowBuilds:
  esbuild: true # postinstall "node install.js" checks the platform binary runs and links it over the JS shim; it fetches from npm only if the optional binary package is missing (read 2026-10-09, 0.28.1)
  workerd: true # postinstall "node install.js" does the same for the workerd binary that the Workers test pool and wrangler dev run (read 2026-10-09, 1.20261006.1)
  bun: true # postinstall "node install.js" finds the binary of the optional package @oven/bun-<platform> 1.4.3 and runs it with --version; when that package is missing it runs npm install of the same version, or fetches that version's tarball from registry.npmjs.org (read 2026-10-14, 1.4.3)
  # electron: no entry. 44.7.0 has no install script; it downloads its binary on the first require (read 2026-10-10).
