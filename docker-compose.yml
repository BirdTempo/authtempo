# Postgres for the adapter tests only. `docker compose up -d` before `pnpm test`.
# Port 5439 avoids the sibling projects on 5432 and 5434.
services:
  postgres:
    image: postgres:17-alpine
    container_name: authtempo-postgres
    environment:
      POSTGRES_USER: tempo
      POSTGRES_PASSWORD: tempo
      POSTGRES_DB: tempo_auth
    ports:
      - "5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempo"]
      interval: 5s
      timeout: 3s
      retries: 10
  # libSQL server for the SQLite adapter tests over HTTP (plan 12g). Port 8089
  # avoids the sibling projects. The image is pinned by its digest beside the
  # tag, because a tag can move. Digest read with `docker images --digests`
  # on 2026-10-21 (ruling 1).
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.32@sha256:dedf5273da945d90f3b85fe367ed8f821349117ac2c488bf43c4a6bf9f2123e0
    container_name: authtempo-libsql
    ports:
      - "8089:8080"
  # A second libSQL server for the CLI tests of plan 12g Task 6 (map point 15,
  # ruling 1). The adapter-sqlite suite empties every ta_ table of the server
  # on 8089. Turbo runs the two packages at once. So on one shared database,
  # that suite could empty the tables of a CLI test. Port 8090 was free by
  # lsof on 2026-10-21.
  libsql-cli:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.32@sha256:dedf5273da945d90f3b85fe367ed8f821349117ac2c488bf43c4a6bf9f2123e0
    container_name: authtempo-libsql-cli
    ports:
      - "8090:8080"
  # A third libSQL server for the CLI compat test of a libSQL URL (ruling 20
  # of the plan 12g lane). migrate-sqlite.test.ts empties every table of the
  # server on 8090, and Vitest runs the two files at once. Port 8091 was free
  # by lsof on 2026-10-22.
  libsql-cli-compat:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.32@sha256:dedf5273da945d90f3b85fe367ed8f821349117ac2c488bf43c4a6bf9f2123e0
    container_name: authtempo-libsql-cli-compat
    ports:
      - "8091:8080"
  # MySQL 8.4 LTS and 9.7 LTS for the MySQL adapter tests (plan 12g, owner
  # decision 2). 8.0 ended on 2026-04-30. Ports 3384 and 3397 name the
  # versions and avoid 3306. Each image is pinned by its digest beside the
  # tag, because a tag can move: both tags were rebuilt on 2026-10-19.
  # Digests read with `docker images --digests` on 2026-10-21 (ruling 1).
  mysql84:
    image: mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
    container_name: authtempo-mysql-84
    environment:
      MYSQL_ROOT_PASSWORD: tempo
    ports:
      - "3384:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptempo"]
      interval: 5s
      timeout: 3s
      retries: 20
  mysql97:
    image: mysql:9.7.2@sha256:e2fa358a74ac81148e7e27d9433e4c0ab62133de8ea4428b4f39a51a4ba7d07f
    container_name: authtempo-mysql-97
    environment:
      MYSQL_ROOT_PASSWORD: tempo
    ports:
      - "3397:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptempo"]
      interval: 5s
      timeout: 3s
      retries: 20
